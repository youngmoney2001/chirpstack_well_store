# Utility workflow: produce an offline `cargo vendor` snapshot for this sandbox.
#
# The sandbox cannot reach crates.io (index.crates.io / static.crates.io are
# blocked by the platform allowlist), but GitHub runners can. This workflow
# vendors every crate listed in Cargo.lock, packs it into <90 MB parts and
# pushes those parts onto this branch so they can be fetched over github.com.
#
# Trigger it with:  gh workflow run vendor-crates.yml --ref <branch>
# or by touching .github/vendor-trigger and pushing.
# The parts are temporary: retrieve them locally, then delete them from git.
name: Vendor crates (offline sandbox)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/vendor-trigger'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Vendor all crates from Cargo.lock
        run: |
          set -euo pipefail
          cargo vendor --versioned-dirs /tmp/vendor > /tmp/vendor-config.toml
          echo "=== vendor size ==="
          du -sh /tmp/vendor
          cd /tmp
          tar -cf - vendor | gzip -1 > vendor.tar.gz
          ls -lh vendor.tar.gz
          mkdir -p parts
          split -b 90m vendor.tar.gz parts/part_
          ls -lh parts/

      - name: Publish parts on this branch
        run: |
          set -euo pipefail
          mkdir -p .vendor-parts
          rm -f .vendor-parts/part_*
          cp /tmp/parts/part_* .vendor-parts/
          printf 'vendor snapshot %s\n' "$(date -u +%FT%TZ)" > .vendor-parts/MANIFEST.txt
          git config user.name "arena-vendor-bot"
          git config user.email "arena-vendor-bot@users.noreply.github.com"
          git add .vendor-parts
          git commit -m "[vendor] crates snapshot [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin "HEAD:${{ github.ref_name }}"
